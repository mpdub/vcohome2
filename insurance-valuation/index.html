  }
  async function decrypt(key, bytes) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12));
  }
  async function open(key, msg) {
    let html = new TextDecoder().decode(await decrypt(key, b64d(PAYLOAD)));
    const paths = [...new Set([...html.matchAll(/enc:([^"]+)/g)].map(m => m[1]))];
    let done = 0;
    const urls = {};
    await Promise.all(paths.map(async p => {
      const res = await fetch(ROOT + p + '.enc');
      const plain = await decrypt(key, new Uint8Array(await res.arrayBuffer()));
      urls[p] = URL.createObjectURL(new Blob([plain], { type: TYPES[p.split('.').pop().toLowerCase()] || 'application/octet-stream' }));
      if (msg) msg.textContent = 'Opening… ' + (++done) + ' of ' + paths.length;
    }));
    html = html.replace(/enc:([^"]+)/g, (_, p) => urls[p]);
    document.open(); document.write(html); document.close();
  }
  async function fromStore() {
    const raw = store.get(KEYNAME); if (!raw) return false;
    try {
      const key = await crypto.subtle.importKey('raw', b64d(raw), { name: 'AES-GCM' }, true, ['decrypt']);
      await open(key); return true;
    } catch { store.clear(KEYNAME); return false; }
  }
  fromStore().then(ok => {
    if (ok) return;
    $('gate').hidden = false; $('pw').focus();
    $('f').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = $('msg'), btn = $('go');
      btn.disabled = true; msg.style.color = 'var(--muted)'; msg.textContent = 'Checking…';
      try {
        const key = await derive($('pw').value);
        await decrypt(key, b64d(PAYLOAD));
        store.set(KEYNAME, b64e(await crypto.subtle.exportKey('raw', key)), $('remember').checked);
        await open(key, msg);
      } catch {
        btn.disabled = false; msg.style.color = ''; msg.textContent = 'That password didn’t work. Check it and try again.';
      }
    });
  });
})();
</script>
