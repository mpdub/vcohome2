  const KEYNAME = 'unlock:' + SITE;
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
  const TYPES = { webp: 'image/webp', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', svg: 'image/svg+xml', mp4: 'video/mp4', webm: 'video/webm', gif: 'image/gif' };
  const $ = id => document.getElementById(id);
  const store = { get(k) { try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch { return null; } },

  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);

  }
  async function decrypt(key, bytes) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12));
  }
  async function open(key, msg) {
    let html = new TextDecoder().decode(await decrypt(key, b64d(PAYLOAD)));
    const paths = [...new Set([...html.matchAll(/enc:([^"]+)/g)].map(m => m[1]))];
    let done = 0;

      const plain = await decrypt(key, new Uint8Array(await res.arrayBuffer()));

    if (ok) return;
