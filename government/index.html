<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Private preview</title>
<style>
:root{--paper:#f4f1ea;--ink:#191919;--muted:#6b675f;--line:#cfc9bf;color-scheme:light}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;font-weight:500;margin:0 0 6px}
label{font-size:13px;color:var(--muted)}
input[type=password]{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
button{font:inherit;padding:12px 14px;border:0;border-radius:6px;background:var(--ink);color:var(--paper);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:1.5em;font-size:14px;color:#9a3412}
</style>
</head>
<body>
<main id="gate" hidden>
<form id="f">
<h1>This preview is private</h1>
<label for="pw">Password</label>
<input id="pw" type="password" autocomplete="current-password" required autofocus>
<label class="row"><input id="remember" type="checkbox"> Remember on this device</label>
<button id="go" type="submit">Open</button>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
</form>

  const KEYNAME = 'unlock:' + SITE;
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
  const TYPES = { webp: 'image/webp', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', svg: 'image/svg+xml', mp4: 'video/mp4', webm: 'video/webm', gif: 'image/gif' };
  const $ = id => document.getElementById(id);
  const store = { get(k) { try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch { return null; } },
                  set(k, v, keep) { try { sessionStorage.setItem(k, v); if (keep) localStorage.setItem(k, v); } catch {} },
                  clear(k) { try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch {} } };
  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);

  }
  async function decrypt(key, bytes) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12));
  }
  async function open(key, msg) {
    let html = new TextDecoder().decode(await decrypt(key, b64d(PAYLOAD)));
    const paths = [...new Set([...html.matchAll(/enc:([^"]+)/g)].map(m => m[1]))];
    let done = 0;
    const urls = {};
    await Promise.all(paths.map(async p => {
      const res = await fetch(ROOT + p + '.enc');
      const plain = await decrypt(key, new Uint8Array(await res.arrayBuffer()));
      urls[p] = URL.createObjectURL(new Blob([plain], { type: TYPES[p.split('.').pop().toLowerCase()] || 'application/octet-stream' }));
      if (msg) msg.textContent = 'Opening… ' + (++done) + ' of ' + paths.length;

    html = html.replace(/enc:([^"]+)/g, (_, p) => urls[p]);
    document.open(); document.write(html); document.close();
  }
  async function fromStore() {
    const raw = store.get(KEYNAME); if (!raw) return false;

      await open(key); return true;

  fromStore().then(ok => {
    if (ok) return;
    $('gate').hidden = false; $('pw').focus();
    $('f').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = $('msg'), btn = $('go');
      btn.disabled = true; msg.style.color = 'var(--muted)'; msg.textContent = 'Checking…';

        await decrypt(key, b64d(PAYLOAD));
        store.set(KEYNAME, b64e(await crypto.subtle.exportKey('raw', key)), $('remember').checked);
